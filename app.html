:root{
  --bg:#050606;--panel:#0B0E0D;--ink:#F2F0EA;--mut:#9AA39D;--dim:#6C746F;--line:#1E2622;
  --mint:#3DF2A0;--mint-ink:#00140B;--gold:#E3C77E;--ice:#BFD4FF;--warn:#FFB86B;
  --r:20px;--pad:20px;--tabs:76px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0}
html{height:100%;background:var(--bg);-webkit-text-size-adjust:100%}
body{min-height:100%;background:var(--bg);color:var(--ink);font-family:Archivo,system-ui,sans-serif;font-size:16px;line-height:1.4;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
a{color:inherit}
ul{list-style:none;padding:0}
img{display:block;max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--mint);outline-offset:3px;border-radius:10px}
.mono{font-family:Martian,ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* Moving light behind everything */
.aurora{position:fixed;inset:0;overflow:hidden;filter:blur(90px);opacity:.55;pointer-events:none}
.aurora i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;animation:drift 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){left:-18vmax;top:-22vmax;background:#0F6B47}
.aurora i:nth-child(2){right:-22vmax;top:10vmax;background:#0C3B46;animation-duration:28s;animation-direction:alternate-reverse}
.aurora i:nth-child(3){left:20vmax;bottom:-36vmax;background:#123a2a;animation-duration:34s}
@keyframes drift{to{transform:translate3d(8vmax,6vmax,0) scale(1.15)}}

.stage{position:relative;height:100vh;height:100dvh;display:grid;place-items:center}
.pitch{display:none}
.phone{width:100%;height:100%}
.app{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden;overflow:clip;background:radial-gradient(120% 50% at 50% 0%,rgba(18,32,26,.9) 0%,rgba(5,6,6,.92) 62%)}

/* Top bar */
.top{flex:none;display:flex;justify-content:space-between;align-items:center;padding:calc(14px + var(--sat)) var(--pad) 10px}
.top__brand{font-stretch:125%;font-weight:620;letter-spacing:.14em;font-size:13px;text-transform:uppercase}
.top__brand b{font-weight:620;color:var(--mint)}
.pill{font-family:Martian,monospace;font-size:11px;letter-spacing:.06em;padding:6px 12px;border-radius:999px;border:1px solid #2c3530;color:var(--mut);background:rgba(255,255,255,.03)}

/* Views */
.views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:6px var(--pad) calc(var(--tabs) + 34px + var(--sab));scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.view>*:nth-child(2){animation-delay:.05s}.view>*:nth-child(3){animation-delay:.1s}.view>*:nth-child(4){animation-delay:.15s}
.view>*:nth-child(5){animation-delay:.2s}.view>*:nth-child(6){animation-delay:.25s}.view>*:nth-child(n+7){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}

.lb{font-size:14px;color:var(--mut)}
.h2{font-stretch:112%;font-weight:640;font-size:22px;letter-spacing:-.01em}
.sec{margin-top:26px;display:flex;justify-content:space-between;align-items:baseline;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.note{margin-top:22px;font-size:12px;line-height:1.5;color:var(--dim);text-align:center}

/* Balance */
.total{margin-top:2px;font-family:Martian,monospace;font-variant-numeric:tabular-nums;font-size:clamp(30px,9.4vw,38px);font-weight:500;letter-spacing:-.04em;line-height:1.15}
.total small{font-size:.5em;color:var(--mut);letter-spacing:0;margin-left:8px;font-family:Archivo,sans-serif}

/* Card picture */
.scene{position:relative;margin-top:14px;border-radius:var(--r);overflow:hidden;background:#000;border:1px solid var(--line);isolation:isolate}
.scene::before{content:"";display:block;padding-top:56.25%}
.scene--big::before{padding-top:65%}
.scene img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.28);transform-origin:50% 42%;transition:filter .45s,opacity .35s}
.scene--big{perspective:900px;border:0;background:none;overflow:visible}
.scene--big .scene__in{position:absolute;inset:0;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);transform:rotateX(calc(var(--ty,0)*1deg)) rotateY(calc(var(--tx,0)*1deg));transition:transform .25s ease-out;box-shadow:0 30px 60px -30px rgba(61,242,160,.35)}
.scene--big.is-gold .scene__in{box-shadow:0 30px 60px -30px rgba(227,199,126,.4)}
.scene__shine{position:absolute;inset:0;background:radial-gradient(60% 60% at var(--sx,30%) var(--sy,20%),rgba(255,255,255,.16),transparent 60%);mix-blend-mode:screen;pointer-events:none}
.scene__frost{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,16,24,.55);opacity:0;transition:opacity .4s;pointer-events:none}
.scene__frost svg{width:44px;height:44px;stroke:#DCE9FF;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.is-frozen .scene img{filter:grayscale(1) brightness(.7)}
.is-frozen .scene__frost{opacity:1}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:0 4px}
.meta .mono{font-size:15px;letter-spacing:.06em}
.state{font-family:Martian,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:5px 11px;border-radius:999px;border:1px solid rgba(61,242,160,.4);color:var(--mint)}
.is-frozen .state{color:var(--ice);border-color:rgba(191,212,255,.5)}

/* Buttons */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:16px;font-weight:640;font-size:16px;text-decoration:none;border:1px solid var(--line);background:rgba(255,255,255,.05);transition:transform .12s,background .2s,opacity .2s;overflow:hidden}
.btn:active{transform:scale(.97)}
.btn--mint{background:var(--mint);color:var(--mint-ink);border-color:transparent;font-weight:720}
.btn--mint::after{content:"";position:absolute;top:-20%;bottom:-20%;left:-40%;width:28%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:sweep 4.5s ease-in-out infinite}
@keyframes sweep{0%,60%{left:-40%}100%{left:130%}}
.btn--wide{display:flex;width:100%}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn--ghost{background:none}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.acts{margin-top:16px;display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:9px}
.acts .btn{min-height:48px;padding:0 6px;font-size:15px;border-radius:15px}
.is-frozen .acts [data-act=freeze]{background:rgba(191,212,255,.16);border-color:rgba(191,212,255,.5);color:var(--ice)}

/* Trade wallet tile */
.trade{position:relative;margin-top:16px;padding:16px;border-radius:var(--r);border:1px solid rgba(61,242,160,.28);background:linear-gradient(140deg,rgba(61,242,160,.1),rgba(61,242,160,.02) 55%),var(--panel);overflow:hidden}
.trade::before{content:"";position:absolute;inset:0;background:radial-gradient(240px 160px at var(--mx,80%) var(--my,0%),rgba(61,242,160,.16),transparent 70%);pointer-events:none}
.trade__top{position:relative;display:flex;align-items:center;gap:10px}
.trade__ico{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:rgba(61,242,160,.14)}
.trade__ico svg{width:19px;height:19px;fill:none;stroke:var(--mint);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.trade__name{flex:1;font-weight:640;font-size:15px;line-height:1.2}
.trade__name small{display:block;font-weight:400;font-size:12px;color:var(--mut);margin-top:2px}
.tag{font-family:Martian,monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:999px;color:var(--mint);border:1px solid rgba(61,242,160,.4);white-space:nowrap}
.tag--dim{color:var(--mut);border-color:#33403a}
.trade__row{position:relative;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:14px}
.trade__val{font-family:Martian,monospace;font-variant-numeric:tabular-nums;font-size:24px;font-weight:500;letter-spacing:-.03em;line-height:1.1}
.trade__val small{display:block;font-size:11px;letter-spacing:0;color:var(--mut);margin-top:5px;font-weight:400}
.trade .btn{min-height:42px;font-size:14px;padding:0 16px;border-radius:13px;white-space:nowrap}

/* Lists */
.list{margin-top:8px;border-radius:var(--r);border:1px solid var(--line);background:rgba(11,14,13,.7);overflow:hidden}
.list li,.list .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;font-size:15px}
.list li+li,.list .row+.row{border-top:1px solid var(--line)}
.list .row--end{justify-content:flex-end}
.list b{font-weight:640;font-stretch:112%}
.list .mono{font-size:14px}
.list small{display:block;font-size:12px;color:var(--mut);margin-top:1px}
.plus{color:var(--mint)}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:rgba(61,242,160,.24)}100%{background:transparent}}

/* Card tab */
.seg{margin-top:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.seg button{min-height:40px;border-radius:12px;font-size:14px;font-weight:600;color:var(--mut);transition:background .2s,color .2s}
.seg button[aria-pressed=true]{background:var(--ink);color:#0a0c0b}
.seg button[data-type=metal][aria-pressed=true]{background:var(--gold)}
.hint{margin-top:10px;text-align:center;font-size:14px;color:var(--mut);min-height:20px}
.row button.link{color:var(--mint);font-weight:640;font-size:14px;min-height:32px;padding:0 4px}
.sw{position:relative;flex:none;width:50px;height:30px;border-radius:999px;background:#232a27;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#F2F0EA;transition:transform .22s cubic-bezier(.3,1.4,.5,1)}
.sw[aria-checked=true]{background:var(--mint)}
.sw[aria-checked=true]::after{transform:translateX(20px);background:#00140B}
.sw--ice[aria-checked=true]{background:var(--ice)}
.sw[disabled]{opacity:.35;pointer-events:none}
.bar{margin-top:10px;height:8px;border-radius:999px;background:#1a201d;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#1FA56B,var(--mint));transform-origin:0 50%;animation:grow .9s cubic-bezier(.2,.7,.2,1) both .25s}
@keyframes grow{from{transform:scaleX(0)}}
.limit{margin-top:8px;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:rgba(11,14,13,.7)}
.limit p{display:flex;justify-content:space-between;font-size:14px}
.limit p span:last-child{color:var(--mut)}

/* Perks */
.tier{font-weight:720;color:var(--mint)}
.tiers{margin-top:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tiers span{padding:9px 4px;border-radius:12px;border:1px solid var(--line);text-align:center;font-size:13px;font-weight:640;color:var(--mut)}
.tiers small{display:block;margin-top:2px;font-family:Martian,monospace;font-size:10px;font-weight:400;color:var(--dim)}
.tiers .is-done{color:var(--ink)}
.tiers .is-me{border-color:rgba(61,242,160,.5);background:rgba(61,242,160,.1);color:var(--mint)}
.tiers .is-me small{color:var(--mint)}
.limit p.limit__note{display:block;margin-top:12px;font-size:12.5px;line-height:1.45;color:var(--dim)}
.list .big{font-size:18px}
.list .inv{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sec .tag{letter-spacing:.08em}
.btn--gold{background:linear-gradient(100deg,#F6E3AA,var(--gold) 45%,#B98F40);color:#1b1003;border-color:transparent;font-weight:720}
.metal{position:relative;margin-top:8px;padding:16px;border-radius:var(--r);border:1px solid rgba(227,199,126,.32);background:linear-gradient(150deg,rgba(227,199,126,.12),rgba(227,199,126,.02) 55%),var(--panel);overflow:hidden}
.metal::before{content:"";position:absolute;inset:0;background:radial-gradient(240px 160px at var(--mx,85%) var(--my,0%),rgba(227,199,126,.16),transparent 70%);pointer-events:none}
.metal__top{position:relative;display:flex;gap:14px;align-items:center}
.metal__top img{flex:none;width:112px;height:63px;object-fit:cover;border-radius:10px;border:1px solid rgba(227,199,126,.25);filter:grayscale(.35) brightness(.75);transition:filter .6s}
.metal__top p{font-size:13.5px;line-height:1.45;color:var(--mut)}
.metal__top b{display:block;font-stretch:112%;font-weight:700;font-size:17px;color:var(--gold);margin-bottom:3px}
.coins{position:relative;display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin:16px 0 14px}
.coins i{aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(227,199,126,.3)}
.coins i.on{border-color:transparent;background:radial-gradient(circle at 35% 30%,#FBE9B4,#C9A24F 70%);box-shadow:0 0 12px rgba(227,199,126,.45)}
.coins i.pop{animation:coin .6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes coin{from{transform:scale(.2);opacity:0}}
.metal.is-open{border-color:rgba(227,199,126,.7);box-shadow:0 0 0 1px rgba(227,199,126,.25),0 24px 60px -24px rgba(227,199,126,.55)}
.metal.is-open .metal__top img{filter:none}
.metal.is-open .coins{margin-bottom:2px}

/* Add money */
.back{display:inline-flex;align-items:center;gap:6px;min-height:40px;margin:0 0 4px -6px;padding:0 8px;color:var(--mut);font-size:14px}
.back svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sub{margin-top:6px;font-size:15px;color:var(--mut)}
.src{position:relative;display:flex;align-items:center;gap:14px;width:100%;margin-top:10px;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:rgba(11,14,13,.7);text-align:left;transition:transform .12s,border-color .2s;overflow:hidden}
.src:active{transform:scale(.985)}
.src--trade{border-color:rgba(61,242,160,.35);background:linear-gradient(140deg,rgba(61,242,160,.1),rgba(61,242,160,.02) 55%),var(--panel)}
.src__ico{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.06)}
.src--trade .src__ico{background:rgba(61,242,160,.14)}
.src__ico svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.src--trade .src__ico svg{stroke:var(--mint)}
.src__t{flex:1;min-width:0;font-weight:640;font-size:16px;line-height:1.25}
.src__t small{display:block;font-weight:400;font-size:13px;color:var(--mut);margin-top:3px}
.src__go{flex:none;width:18px;height:18px;fill:none;stroke:var(--dim);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.chips{margin-top:14px;display:flex;gap:8px}
.chips button{flex:1;min-height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:14px;font-weight:600;color:var(--mut)}
.chips button[aria-pressed=true]{border-color:var(--mint);color:var(--mint);background:rgba(61,242,160,.08)}
.amt{margin-top:18px;text-align:center}
.amt__n{font-family:Martian,monospace;font-variant-numeric:tabular-nums;font-size:clamp(38px,12vw,48px);font-weight:500;letter-spacing:-.04em;line-height:1.1}
.amt__n i{font-style:normal;color:var(--dim)}
.amt__s{margin-top:6px;font-size:13px;color:var(--mut);min-height:18px}
.amt__s.is-over{color:var(--warn)}
.pad{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{min-height:52px;border-radius:15px;font-family:Martian,monospace;font-size:21px;background:rgba(255,255,255,.04);transition:background .15s,transform .1s}
.pad button:active{background:rgba(255,255,255,.12);transform:scale(.96)}
.pad svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
.cta{margin-top:14px}
.info{margin-top:14px;padding:14px 16px;border-radius:16px;background:rgba(61,242,160,.07);border:1px solid rgba(61,242,160,.2);font-size:13.5px;line-height:1.5;color:#CFE9DC}
.info--plain{background:rgba(255,255,255,.04);border-color:var(--line);color:var(--mut)}
.slot{margin-top:14px;padding:26px 18px;border-radius:var(--r);border:1px dashed #33403a;text-align:center;font-size:14px;line-height:1.5;color:var(--mut)}
.slot svg{width:28px;height:28px;margin:0 auto 10px;display:block;fill:none;stroke:var(--dim);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* Telegram step */
.tg{margin-top:14px;border-radius:var(--r);overflow:hidden;border:1px solid #223041;background:#0E1621}
.tg__bar{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#17212B;font-weight:640;font-size:15px}
.tg__av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#050606;border:1px solid rgba(61,242,160,.5)}
.tg__av svg{width:20px;height:20px;fill:none;stroke:var(--mint);stroke-width:5;stroke-linecap:round}
.tg__bar small{display:block;font-weight:400;font-size:12px;color:#7F91A4}
.tg__body{padding:16px 12px 14px}
.tg__msg{max-width:92%;padding:11px 13px;border-radius:14px 14px 14px 4px;background:#182533;font-size:15px;line-height:1.45;animation:pop .45s cubic-bezier(.3,1.3,.5,1) both .2s}
.tg__msg b{font-weight:640}
.tg__keys{max-width:92%;margin-top:6px;display:grid;grid-template-columns:1fr 1fr;gap:6px;animation:pop .45s cubic-bezier(.3,1.3,.5,1) both .45s}
.tg__keys button{min-height:44px;border-radius:10px;background:#22303F;font-size:15px;font-weight:600}
.tg__keys button:first-child{background:#2B5278}
.tg__keys button:active{filter:brightness(1.25)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}}

/* Done */
.done{margin-top:36px;text-align:center}
.done__ok{width:84px;height:84px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:var(--mint);animation:pop .5s cubic-bezier(.3,1.5,.5,1) both;box-shadow:0 0 0 12px rgba(61,242,160,.12),0 0 60px rgba(61,242,160,.4)}
.done__ok svg{width:40px;height:40px;fill:none;stroke:var(--mint-ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30;animation:draw .4s ease-out forwards .3s}
@keyframes draw{to{stroke-dashoffset:0}}
.done__n{margin-top:22px;font-family:Martian,monospace;font-size:28px;font-weight:500;letter-spacing:-.03em}
.done .sub{margin-bottom:26px}

/* Bottom bar */
.tabs{position:absolute;left:14px;right:14px;bottom:calc(12px + var(--sab));height:64px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;border-radius:24px;background:rgba(18,23,21,.72);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid rgba(255,255,255,.08);box-shadow:0 18px 40px -12px rgba(0,0,0,.8);transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .25s,visibility .25s}
.is-flow .tabs{transform:translateY(10px);opacity:0;visibility:hidden;pointer-events:none}
.is-flow #v-add{padding-bottom:calc(26px + var(--sab))}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:18px;font-size:11.5px;font-weight:600;color:var(--mut);transition:background .2s,color .2s}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current=page]{color:var(--mint);background:rgba(61,242,160,.1)}

/* Sheet */
.sheet{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end}
.sheet__back{position:absolute;inset:0;background:rgba(0,0,0,.66);animation:fade .25s both}
.sheet__box{position:relative;width:100%;max-height:86%;overflow-y:auto;padding:10px var(--pad) calc(22px + var(--sab));border-radius:28px 28px 0 0;background:#0E1211;border-top:1px solid #26302b;animation:up .38s cubic-bezier(.2,.8,.2,1) both}
.sheet__grip{width:40px;height:4px;border-radius:4px;background:#2c3530;margin:0 auto 18px}
.sheet h2{font-stretch:112%;font-weight:660;font-size:22px;line-height:1.2;letter-spacing:-.01em}
.sheet p{margin-top:10px;font-size:15px;line-height:1.5;color:#C3C9C4}
.sheet__acts{margin-top:20px;display:grid;gap:10px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}

.toast{position:absolute;left:50%;top:calc(58px + var(--sat));z-index:30;transform:translate(-50%,-20px);padding:11px 18px;border-radius:999px;background:var(--ink);color:#0a0c0b;font-weight:640;font-size:14px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .25s,transform .3s cubic-bezier(.3,1.3,.5,1)}
.toast.is-on{opacity:1;transform:translate(-50%,0)}

.spark{position:fixed;z-index:50;width:0;height:0;pointer-events:none}
.spark i{position:absolute;left:-1px;top:-5px;width:2px;height:10px;border-radius:2px;background:var(--mint);animation:spark .45s ease-out forwards}
@keyframes spark{from{opacity:1;transform:rotate(var(--a)) translateY(-6px) scaleY(1)}to{opacity:0;transform:rotate(var(--a)) translateY(-26px) scaleY(.3)}}

.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mint);margin-right:10px;box-shadow:0 0 0 0 rgba(61,242,160,.5);animation:pulse 2s ease-out infinite}
@keyframes pulse{to{box-shadow:0 0 0 9px rgba(61,242,160,0)}}
.shiny{background:linear-gradient(100deg,#1FA56B 0%,#3DF2A0 30%,#E8FFF4 48%,#3DF2A0 62%,#1FA56B 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{from{background-position:120% 0}to{background-position:-140% 0}}
.nojs{position:fixed;inset:auto 0 0;padding:16px;text-align:center;background:#000}

/* Wide screens: the app sits in a phone next to a short pitch */
@media (min-width:900px){
  body{overflow:auto}
  .stage{min-height:100vh;min-height:100dvh;height:auto;grid-template-columns:minmax(0,min(34vw,660px)) auto;gap:clamp(48px,5vw,120px);justify-content:center;padding:32px}
  .pitch{display:block}
  .pitch__eye{font-family:Martian,monospace;font-size:clamp(13px,.95vw,18px);letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
  .pitch__h{margin-top:18px;font-stretch:125%;font-weight:520;font-size:clamp(44px,3.9vw,86px);line-height:1.04;letter-spacing:-.01em;text-transform:uppercase}
  .pitch__p{margin:clamp(22px,1.8vw,34px) 0 clamp(28px,2.2vw,42px);font-size:clamp(17px,1.32vw,26px);line-height:1.55;color:#C3C9C4}
  .pitch .btn{min-height:clamp(50px,3.7vw,70px);padding:0 clamp(22px,2vw,40px);font-size:clamp(16px,1.2vw,22px);border-radius:clamp(16px,1.2vw,22px)}
  .pitch__note{margin-top:clamp(26px,2vw,38px);font-size:clamp(13px,.9vw,16px);line-height:1.55;color:var(--dim)}

  function countUp() {
    const el = $('#tot'), to = total(), from = shown;

      if (p < 1 && el.isConnected) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);

  function perks() {
    const i = TIERS.reduce((k, t, n) => S.fin >= t[1] ? n : k, -1);
    const cur = i >= 0 ? TIERS[i][0] : 'No tier yet', next = TIERS[i + 1];
    const from = i >= 0 ? TIERS[i][1] : 0, pct = next ? Math.min(100, (S.fin - from) / (next[1] - from) * 100) : 100;
    V.perks.innerHTML = `
      <p class="lb">$FINNPUTER in your Trade wallet</p>
      <p class="total">${Math.round(S.fin).toLocaleString('en-US')}</p>
      <div class="limit">
        <p><span>Tier <b class="tier">${cur}</b></span><span class="mono">${next ? mil(next[1] - S.fin) + ' to ' + next[0] : 'Top tier'}</span></p>
        <div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div>
        <div class="tiers">
          ${TIERS.map((t, n) => `<span class="${n === i ? 'is-me' : n < i ? 'is-done' : ''}">${t[0]}<small>${mil(t[1])}</small></span>`).join('')}
        </div>
        <p class="limit__note">Every tier lowers your card fee. Rates come with the price list.</p>
      </div>
      <p class="sec"><span>10 for metal</span><span class="tag">Premium</span></p>
      <div class="metal${S.prem >= METAL_AT ? ' is-open' : ''}" data-glow>${metal()}</div>
      <p class="sec"><span>Waitlist</span></p>
      <div class="list">
        <div class="row"><span>Your number</span><span class="mono big">#${String(MY_NO).padStart(3, '0')}</span></div>
        <div class="row"><span>Every friend who joins</span><span class="mono plus">+${BOOST} places</span></div>
        <div class="row"><span class="mono inv">${INVITE}</span><button class="link" type="button" data-act="copyInvite">Copy</button></div>
      </div>
      ${note}`;
  }

  function metal() {
    const open = S.prem >= METAL_AT;
    return `
        <div class="metal__top">
          <img src="${IMG.metal}" alt="" width="1100" height="619">
          <p><b>${open ? 'Metal unlocked' : S.prem + ' of ' + METAL_AT + ' Premium friends'}</b>${open ? 'Front of the first metal batch, 50% off the metal card price.' : 'Bring ' + METAL_AT + ' friends to Premium: front of the first metal batch, 50% off the metal card price.'}</p>
        </div>
        <div class="coins" aria-label="${S.prem} of ${METAL_AT}">${Array.from({ length: METAL_AT }, (_, n) => `<i${n < S.prem ? ' class="on"' : ''}></i>`).join('')}</div>
        ${open ? '' : `<button class="btn btn--gold btn--wide" type="button" data-act="friend">${I.user}Invite a Premium friend</button>`}`;
  }

  function friend() {
    if (S.prem >= METAL_AT) return;
    S.prem++;
    const box = $('.metal');
    box.innerHTML = metal();
    box.classList.toggle('is-open', S.prem >= METAL_AT);
    const c = $$('.coins i', box)[S.prem - 1];
    if (c) c.classList.add('pop');
    const f = $('[data-act=friend]', box);
    if (f) f.focus({ preventScroll: true });
    if (S.prem >= METAL_AT) {
      setTimeout(() => open('Metal unlocked',
        '<p>Ten friends on Premium. You are at the front of the first metal batch, with 50% off the metal card price.</p>',
        `<button class="btn btn--gold btn--wide" type="button" data-act="close">Nice</button><a class="btn btn--wide" href="${WAITLIST}">Join the waitlist</a>`), 500);
    } else toast('A friend joined Premium');
  }

  /* ---------- Add money ---------- */
  const back = to => `<button class="back" type="button" data-step="${to}">${I.back}Back</button>`;

  function sendText() {
    const a = amount();
    return S.add.asset === 'USDC' ? fmt(a) + ' USDC' : fmt(a / USD_PER_SOL, 4) + ' SOL';
  }

  function add() {
    const st = S.add.step, a = amount();
    let h = '';
    if (st === 'source') {
      h = `
        <h1 class="h2">Add money</h1>
        <p class="sub">Choose where it comes from.</p>
        <button class="src src--trade" type="button" data-step="amount">
          <span class="src__ico">${I.trade}</span>
          <span class="src__t">FINNPUTER Trade wallet<small>$${fmt(tradeUsd())} ready in your Telegram bot</small></span>${I.go}
        </button>
        <button class="src" type="button" data-step="coin">
          <span class="src__ico">${I.coin}</span>
          <span class="src__t">Stablecoin deposit<small>From any wallet</small></span><span class="tag tag--dim">Planned</span>${I.go}
        </button>
        <button class="src" type="button" data-step="bank">
          <span class="src__ico">${I.bank}</span>
          <span class="src__t">Bank transfer<small>From your bank account</small></span><span class="tag tag--dim">Planned</span>${I.go}
        </button>
        ${note}`;
    } else if (st === 'amount') {
      h = `
        ${back('source')}
        <h1 class="h2">From your Trade wallet</h1>
        <div class="chips" role="group" aria-label="Pay from">
          <button type="button" data-asset="USDC" aria-pressed="${S.add.asset === 'USDC'}">USDC</button>
          <button type="button" data-asset="SOL" aria-pressed="${S.add.asset === 'SOL'}">SOL</button>
        </div>
        <div class="amt">
          <p class="amt__n" id="amtN" aria-live="polite"></p>
          <p class="amt__s" id="amtS"></p>
        </div>
        <div class="chips" role="group" aria-label="Quick amounts">
          <button type="button" data-quick="50">$50</button>
          <button type="button" data-quick="100">$100</button>
          <button type="button" data-quick="250">$250</button>
          <button type="button" data-quick="max">Max</button>
        </div>
        <div class="pad" role="group" aria-label="Amount">
          ${['1', '2', '3', '4', '5', '6', '7', '8', '9', '.', '0'].map(k => `<button type="button" data-key="${k}">${k}</button>`).join('')}
          <button type="button" data-key="del" aria-label="Delete">${I.del}</button>
        </div>
        <button class="btn btn--mint btn--wide cta" type="button" id="amtGo" data-step="review">Continue</button>`;
    } else if (st === 'review') {
      h = `
        ${back('amount')}
        <h1 class="h2">Check and confirm</h1>
        <div class="list" style="margin-top:14px">
          <div class="row"><span>From</span><span>FINNPUTER Trade wallet</span></div>
          <div class="row"><span>To</span><span>FINNPUTER Card <span class="mono">•••• ${LAST4}</span></span></div>
          <div class="row"><span>You send</span><span class="mono">${sendText()}</span></div>
          <div class="row"><span>Arrives on your card</span><span class="mono plus">$${fmt(a)}</span></div>
          <div class="row"><span>Fee</span><span style="color:var(--mut)">Announced with pricing</span></div>
        </div>
        ${S.add.asset === 'SOL' ? '<p class="info info--plain">Your SOL is swapped to USDC inside your Trade wallet first.</p>' : ''}
        <p class="info">You confirm this in Telegram. Your Trade wallet signs the transfer there. This app never sees your keys.</p>
        <button class="btn btn--mint btn--wide cta" type="button" data-step="tg">${I.send}Confirm in Telegram</button>`;
    } else if (st === 'tg') {
      h = `
        ${back('review')}
        <h1 class="h2">Confirm in Telegram</h1>
        <p class="sub">This is the message FINNPUTER Trade sends you.</p>
        <div class="tg">
          <div class="tg__bar"><span class="tg__av">${I.face}</span><span>FINNPUTER Trade<small>bot</small></span></div>
          <div class="tg__body">
            <p class="tg__msg">Move <b>${sendText()}</b> from your Trade wallet to your FINNPUTER Card ending ${LAST4}?</p>
            <div class="tg__keys">
              <button type="button" data-act="confirm">Confirm</button>
              <button type="button" data-act="cancel">Cancel</button>
            </div>
          </div>
        </div>
        <p class="info info--plain">Nothing leaves your wallet until you tap Confirm.</p>`;
    } else if (st === 'done') {
      h = `
        <div class="done">
          <div class="done__ok">${I.check}</div>
          <p class="done__n">+$${fmt(S.add.last || 0)}</p>
          <p class="sub">On your card and ready to spend.</p>
          <button class="btn btn--mint btn--wide" type="button" data-act="home">Back to home</button>
          <button class="btn btn--ghost btn--wide" type="button" data-step="source" style="margin-top:10px">Add more</button>
        </div>`;
    } else {
      const coin = st === 'coin';
      h = `
        ${back('source')}
        <h1 class="h2">${coin ? 'Stablecoin deposit' : 'Bank transfer'}</h1>
        <p class="sub">${coin ? 'Topping up with stablecoins from any wallet is planned.' : 'Topping up by bank transfer is planned.'}</p>
        <div class="slot">${coin ? I.coin : I.bank}How it will work depends on the final card programme. The waitlist hears first.</div>
        <p class="info info--plain">${coin ? 'Supported coins and networks are announced before launch.' : 'Supported currencies and countries are announced before launch.'}</p>
        <a class="btn btn--mint btn--wide cta" href="${WAITLIST}">Join the waitlist</a>`;
    }
    V.add.innerHTML = h;
    V.add.scrollTop = 0;
    flow();
    if (st === 'amount') amt();
  }

  /* The bar at the bottom steps aside while you are in the middle of a transfer. */
  function flow() {
    app.classList.toggle('is-flow', S.tab === 'add' && ['amount', 'review', 'tg'].includes(S.add.step));
  }

  /* Only the number changes while typing, so the screen does not jump. */
  function amt() {
    const n = $('#amtN'), s = $('#amtS'), go = $('#amtGo');
    if (!n) return;
    const a = amount(), av = avail(), over = a > av + 1e-9;
    n.innerHTML = S.add.amt ? '$' + S.add.amt.replace(/^(\d+)/, m => (+m).toLocaleString('en-US')) : '<i>$0</i>';
    s.className = 'amt__s' + (over ? ' is-over' : '');
    s.textContent = over ? 'That is more than you have in your Trade wallet.'
      : S.add.asset === 'USDC' ? 'Available: ' + fmt(S.trade.USDC) + ' USDC'
        : 'Available: ' + fmt(S.trade.SOL) + ' SOL, about $' + fmt(av);
    go.disabled = !(a > 0) || over;
  }

  function key(k) {
    let v = S.add.amt;
    if (k === 'del') v = v.slice(0, -1);
    else if (k === '.') { if (!v.includes('.')) v = (v || '0') + '.'; }
    else {
      const [i, d] = v.split('.');
      if (d !== undefined) { if (d.length < 2) v += k; }
      else if (v === '0') v = k;
      else if (i.length < 6) v += k;
    }
    S.add.amt = v;
    amt();
  }

  function confirm() {
    const a = amount();
    if (!(a > 0) || a > avail() + 1e-9) return;
    if (S.add.asset === 'USDC') S.trade.USDC = Math.max(0, Math.round((S.trade.USDC - a) * 100) / 100);
    else S.trade.SOL = Math.max(0, S.trade.SOL - a / USD_PER_SOL);
    S.bal += a;
    S.tx.unshift({ n: 'From Trade wallet', s: 'Just now', v: '+$' + fmt(a), plus: true, fresh: true });
    S.add = { step: 'done', asset: S.add.asset, amt: '', last: a };
    add();
    home();
  }

  /* ---------- Navigation ---------- */
  function show(tab) {
    S.tab = tab;
    for (const k in V) V[k].hidden = k !== tab;
    $$('.tabs button').forEach(b => b.toggleAttribute('aria-current', b.dataset.tab === tab));
    $$('.tabs button[aria-current]').forEach(b => b.setAttribute('aria-current', 'page'));
    V[tab].scrollTop = 0;
    if (tab === 'home') countUp();
    if (tab === 'add' && S.add.step === 'done') { S.add.step = 'source'; add(); }
    flow();
  }

  function freeze(on) {
    S.frozen = on;
    app.classList.toggle('is-frozen', on);
    home(); card();
    toast(on ? 'Card frozen' : 'Card active again');
  }

  /* ---------- Sheet and toast ---------- */
  const sheet = $('#sheet');
  let opener = null;
  function open(title, body, acts) {
    opener = document.activeElement;
    $('#sheetT').textContent = title;
    $('#sheetB').innerHTML = body;
    $('#sheetA').innerHTML = acts;
    sheet.hidden = false;
    const f = $('#sheetA button, #sheetA a');
    if (f) f.focus({ preventScroll: true });
  }
  function close() {
    if (sheet.hidden) return;
    sheet.hidden = true;
    if (opener && opener.isConnected) opener.focus({ preventScroll: true });
  }
  const ok = '<button class="btn btn--mint btn--wide" type="button" data-act="close">Got it</button>';
  function intro() {
    open('A look at the app we are building',
      '<p>Everything you see here is a design preview with sample data. Nothing moves real money, and features can change before launch.</p><p>The card is in development. Join the waitlist and you hear first when ordering opens.</p>',
      `<button class="btn btn--mint btn--wide" type="button" data-act="close">Look around</button><a class="btn btn--wide" href="${WAITLIST}">Join the waitlist</a>`);
  }

  let toastT;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('is-on');
    clearTimeout(toastT);
    toastT = setTimeout(() => t.classList.remove('is-on'), 2200);
  }

  /* ---------- Events ---------- */
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-tab],[data-act],[data-step],[data-type],[data-sw],[data-asset],[data-quick],[data-key]');
    if (!b) return;
    const d = b.dataset;
    if (d.tab) return show(d.tab);
    if (d.key) return key(d.key);
    if (d.quick) {
      S.add.amt = d.quick === 'max' ? avail().toFixed(2) : d.quick;
      return amt();
    }
    if (d.asset) { S.add.asset = d.asset; S.add.amt = ''; return add(); }
    if (d.step) { S.add.step = d.step; if (d.step === 'source') S.add.amt = ''; return add(); }
    if (d.type) { S.type = d.type; card(); home(); return; }
    if (d.sw) {
      if (d.sw === 'frozen') return freeze(!S.frozen);
      S[d.sw] = !S[d.sw];
      b.setAttribute('aria-checked', S[d.sw]);
      return;
    }
    switch (d.act) {
      case 'freeze': return freeze(!S.frozen);
      case 'fromTrade': S.add = { step: 'amount', asset: 'USDC', amt: '' }; add(); return show('add');
      case 'confirm': return confirm();
      case 'cancel': S.add.step = 'review'; add(); return toast('Nothing was moved');
      case 'home': return show('home');
      case 'friend': return friend();
      case 'copyInvite': return toast('Sample link. Your own comes with the waitlist');
      case 'close': return close();
      case 'intro': return intro();
      case 'details': return open('Card details on request',
        '<p>In the live app you see your full card number and security code only after you confirm it is you. FINNPUTER does not store them.</p>', ok);
      case 'wallet': return open('Pay with your phone',
        '<p>Phone wallet support is planned where the card programme supports it. We announce it before launch.</p>', ok);
    }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') return close();
    if (S.tab !== 'add' || S.add.step !== 'amount' || !sheet.hidden || e.metaKey || e.ctrlKey) return;
    if (/^[0-9]$/.test(e.key)) key(e.key);
    else if (e.key === '.' || e.key === ',') key('.');
    else if (e.key === 'Backspace') key('del');
  });

  /* Light follows the pointer on the card and on the Trade tile. */
  document.addEventListener('pointermove', e => {
    const t = e.target.closest && e.target.closest('[data-tilt],[data-glow]');
    if (!t || calm) return;
    const r = t.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    if (t.hasAttribute('data-tilt')) {
      t.style.setProperty('--tx', ((x - .5) * 12).toFixed(2));
      t.style.setProperty('--ty', ((.5 - y) * 10).toFixed(2));
      t.style.setProperty('--sx', (x * 100).toFixed(1) + '%');
      t.style.setProperty('--sy', (y * 100).toFixed(1) + '%');
    } else {
      t.style.setProperty('--mx', (x * 100).toFixed(1) + '%');
      t.style.setProperty('--my', (y * 100).toFixed(1) + '%');
    }
  }, { passive: true });
  document.addEventListener('pointerout', e => {
    const t = e.target.closest && e.target.closest('[data-tilt]');
    if (t && !t.contains(e.relatedTarget)) { t.style.setProperty('--tx', 0); t.style.setProperty('--ty', 0); }
  }, { passive: true });

  /* Small sparks where you tap a button. */
  document.addEventListener('pointerdown', e => {
    if (calm || !e.target.closest || !e.target.closest('button,.btn')) return;
    const s = document.createElement('span');
    s.className = 'spark';
    s.style.left = e.clientX + 'px';
    s.style.top = e.clientY + 'px';
    for (let i = 0; i < 6; i++) {
      const l = document.createElement('i');
      l.style.setProperty('--a', (i * 60 + 15) + 'deg');
      s.appendChild(l);
    }
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 500);
  }, { passive: true });

  /* On a desktop the phone grows or shrinks as a whole, so it always fills the window height and keeps its shape. */
  const phone = $('.phone'), wide = matchMedia('(min-width:900px)');
  function fit() {
    if (!wide.matches) { phone.style.zoom = ''; return; }
    const s = Math.max(.7, Math.min(1.8, (innerHeight - 64) / 860, innerWidth * .44 / 404));
    phone.style.zoom = s.toFixed(3);
  }
  fit();
  addEventListener('resize', fit);

  /* ---------- Start ---------- */
  home(); card(); add(); perks();
  const want = location.hash.slice(1);
  show(V[want] ? want : 'home');

  let seen = false;
  try { seen = localStorage.getItem('fc_app_intro') === '1'; } catch (_) { /* private mode */ }
  if (!seen) {
    setTimeout(intro, 900);
    try { localStorage.setItem('fc_app_intro', '1'); } catch (_) { /* private mode */ }
  }

})();
</script>
</body>
</html>
